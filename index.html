<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • My Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white px-6 py-4">
  <h1 class="text-lg font-bold">Sky Dreamers</h1>
  <p class="text-sm text-blue-100">My Performance</p>
</header>

<!-- CONTENT -->
<main class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- LAST ACTIVITY -->
  <div class="text-sm text-gray-500">
    Last activity:
    <span id="lastSubmission" class="font-medium text-gray-700">—</span>
  </div>

  <!-- METRICS -->
  <div id="metrics" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>

</main>

<script>
/* ================= CONFIG ================= */

// Hardcoded identity (intentionally simple)
const CURRENT_AGENT = "ME";

// Firebase node for My Performance
const FIREBASE_NODE = "dashboard_v2";

/* ================= FIREBASE ================= */

firebase.initializeApp({
  databaseURL: "https://performance-dashboard-c7017-default-rtdb.firebaseio.com"
});

/* ================= STATE ================= */

let data = null;

/* ================= HELPERS ================= */

function card(label, value, hint = "") {
  return `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-gray-500">${label}</div>
      <div class="text-2xl font-bold">${value}</div>
      ${hint ? `<div class="text-xs text-gray-400 mt-1">${hint}</div>` : ""}
    </div>
  `;
}

function fmt(num) {
  return (num || 0).toFixed(2);
}

function duration(sec) {
  if (!sec) return "0:00";
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

/* ================= RENDER ================= */

function renderMyPerformance() {
  const container = document.getElementById("metrics");
  container.innerHTML = "";

  const me = data?.agent?.[CURRENT_AGENT] || {
    submissions: 0,
    qualified: 0,
    fph: 0,
    sph: 0,
    avgTalkTime: 0
  };

  container.innerHTML += card(
    "My Submissions",
    me.submissions,
    "Total submitted in this shift"
  );

  container.innerHTML += card(
    "Qualified",
    me.qualified,
    "Approved or enrolled"
  );

  container.innerHTML += card(
    "FPH",
    fmt(me.fph),
    "Forms per hour"
  );

  container.innerHTML += card(
    "SPH",
    fmt(me.sph),
    "Sales per hour"
  );

  container.innerHTML += card(
    "Avg Talk Time",
    duration(me.avgTalkTime),
    "Per submitted call"
  );
}

  container.innerHTML += card("My Submissions", me.submissions);
  container.innerHTML += card("Qualified", me.qualified);
  container.innerHTML += card("FPH", fmt(me.fph), "Forms per hour");
  container.innerHTML += card("SPH", fmt(me.sph), "Sales per hour");
  container.innerHTML += card(
    "Avg Talk Time",
    duration(me.avgTalkTime),
    "Per submitted call"
  );
}

function render() {
  if (!data) return;

  document.getElementById("lastSubmission").textContent =
    data.lastSubmission
      ? new Date(data.lastSubmission).toLocaleString()
      : "—";

  renderMyPerformance();
}

/* ================= DATA ================= */

firebase.database()
  .ref(`${FIREBASE_NODE}/live`)
  .on("value", snapshot => {
    data = snapshot.val();
    render();
  });
</script>

</body>
</html>
