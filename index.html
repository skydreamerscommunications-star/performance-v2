<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • My Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white px-6 py-4">
  <h1 class="text-lg font-bold">Sky Dreamers</h1>
  <p class="text-sm text-blue-100">My Performance</p>
</header>

<main class="max-w-3xl mx-auto px-6 py-8 space-y-10">

  <!-- ZONE A: ORIENTATION -->
  <section class="bg-white rounded-xl shadow p-6 space-y-1">
    <div class="text-sm text-gray-500">Status</div>
    <div id="statusText" class="text-xl font-semibold">—</div>
    <div id="statusHint" class="text-sm text-gray-400">—</div>
  </section>

  <!-- ZONE B: MOMENTUM STREAM -->
  <section class="space-y-3">
    <h2 class="text-sm uppercase tracking-wide text-gray-500">
      Momentum
    </h2>

    <div id="stream" class="bg-white rounded-xl shadow p-4 space-y-3 text-sm">
      <!-- events injected here -->
    </div>
  </section>

  <!-- ZONE C: CONTEXT -->
  <section class="bg-white rounded-xl shadow p-4 grid grid-cols-2 text-center">
    <div>
      <div class="text-xs text-gray-500">Submissions Today</div>
      <div id="subsCount" class="text-xl font-bold">0</div>
    </div>
    <div>
      <div class="text-xs text-gray-500">Qualified Today</div>
      <div id="qualCount" class="text-xl font-bold">0</div>
    </div>
  </section>

</main>

<script>
/* ================= CONFIG ================= */

const FIREBASE_NODE = "dashboard_v2";
const CURRENT_AGENT = "ME";

/* ================= FIREBASE ================= */

firebase.initializeApp({
  databaseURL: "https://performance-dashboard-c7017-default-rtdb.firebaseio.com"
});

/* ================= STATE ================= */

let state = {
  agent: {},
  lastSubmission: null,
  raw: []
};

/* ================= HELPERS ================= */

function minutesAgo(ts) {
  return Math.floor((Date.now() - ts) / 60000);
}

/* ================= ORIENTATION ================= */

function renderOrientation() {
  const last = state.lastSubmission
    ? new Date(state.lastSubmission)
    : null;

  const statusEl = document.getElementById("statusText");
  const hintEl = document.getElementById("statusHint");

  if (!last) {
    statusEl.textContent = "Not Started";
    hintEl.textContent = "Your shift hasn’t begun yet.";
    return;
  }

  const mins = minutesAgo(last);

  if (mins <= 15) {
    statusEl.textContent = "In Progress";
    hintEl.textContent = "You’re inside an active window.";
  } else if (mins <= 45) {
    statusEl.textContent = "Cooling Down";
    hintEl.textContent = "Momentum is slowing.";
  } else {
    statusEl.textContent = "Stalled";
    hintEl.textContent = "No recent activity detected.";
  }
}

/* ================= STREAM ================= */

function renderStream() {
  const box = document.getElementById("stream");
  box.innerHTML = "";

  if (!state.raw.length) {
    box.innerHTML = `
      <div class="text-gray-400 text-sm">
        No activity yet. Once you take action, it will appear here.
      </div>
    `;
    return;
  }

  state.raw.slice(0, 5).forEach(e => {
    box.innerHTML += `
      <div class="flex justify-between">
        <div>${e.type}</div>
        <div class="text-gray-400">${e.ago} min ago</div>
      </div>
    `;
  });
}

/* ================= CONTEXT ================= */

function renderContext() {
  const me = state.agent[CURRENT_AGENT] || {};
  document.getElementById("subsCount").textContent = me.submissions || 0;
  document.getElementById("qualCount").textContent = me.qualified || 0;
}

/* ================= RENDER ================= */

function renderAll() {
  renderOrientation();
  renderStream();
  renderContext();
}

/* ================= FIREBASE ================= */

firebase.database()
  .ref(`${FIREBASE_NODE}/live`)
  .on("value", snap => {
    if (!snap.val()) return;

    const d = snap.val();
    state.agent = d.agent || {};
    state.lastSubmission = d.lastSubmission || null;

    // TEMP: fake stream using lastSubmission
    if (d.lastSubmission) {
      state.raw = [
        { type: "Submission submitted", ago: minutesAgo(new Date(d.lastSubmission)) }
      ];
    }

    renderAll();
  });

renderAll();
</script>

</body>
</html>
