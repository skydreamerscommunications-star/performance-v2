<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • My Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen">

<header class="bg-blue-600 text-white px-6 py-4">
  <h1 class="text-lg font-bold">Sky Dreamers</h1>
  <p class="text-sm text-blue-100">My Performance</p>
</header>

<main class="max-w-3xl mx-auto px-6 py-8 space-y-10">

  <!-- ZONE A: SHIFT TIMELINE -->
  <section class="bg-white rounded-xl shadow p-6 space-y-4">
    <div class="text-sm text-gray-500">Shift Timeline</div>

    <div class="flex justify-between text-sm">
      <span id="step-not-started">Not Started</span>
      <span id="step-in-progress">In Progress</span>
      <span id="step-cooling">Cooling Down</span>
      <span id="step-ended">Ended</span>
    </div>

    <div id="shiftHint" class="text-sm text-gray-400"></div>
  </section>

  <!-- ZONE B: MOMENTUM STREAM -->
  <section class="space-y-3">
    <h2 class="text-sm uppercase tracking-wide text-gray-500">
      Momentum
    </h2>

    <div id="stream" class="bg-white rounded-xl shadow p-4 space-y-3 text-sm"></div>
  </section>

  <!-- ZONE C: CONTEXT -->
  <section class="bg-white rounded-xl shadow p-4 text-center">
    <div class="text-xs text-gray-500 mb-2">Today so far</div>
    <div class="flex justify-around">
      <div>
        <div class="text-xl font-bold" id="subsCount">0</div>
        <div class="text-xs text-gray-500">Submissions</div>
      </div>
      <div>
        <div class="text-xl font-bold" id="qualCount">0</div>
        <div class="text-xs text-gray-500">Qualified</div>
      </div>
    </div>
  </section>

</main>

<script>
/* ================= CONFIG ================= */

const FIREBASE_NODE = "dashboard_v2";
const CURRENT_AGENT = "ME";

/* ================= FIREBASE ================= */

firebase.initializeApp({
  databaseURL: "https://performance-dashboard-c7017-default-rtdb.firebaseio.com"
});

/* ================= STATE ================= */

let state = {
  agent: {},
  lastSubmission: null,
  raw: []
};

/* ================= HELPERS ================= */

function minsAgo(ts) {
  return Math.floor((Date.now() - ts) / 60000);
}

function setActiveStep(stepId) {
  ["step-not-started", "step-in-progress", "step-cooling", "step-ended"]
    .forEach(id => {
      const el = document.getElementById(id);
      el.className = "text-gray-400";
    });

  document.getElementById(stepId).className =
    "text-blue-600 font-semibold";
}

/* ================= SHIFT LOGIC ================= */

function renderShift() {
  const hint = document.getElementById("shiftHint");

  if (!state.lastSubmission) {
    setActiveStep("step-not-started");
    hint.textContent = "Your shift hasn’t begun yet.";
    return;
  }

  const mins = minsAgo(new Date(state.lastSubmission));

  if (mins <= 15) {
    setActiveStep("step-in-progress");
    hint.textContent = "You are inside an active working window.";
  } else if (mins <= 45) {
    setActiveStep("step-cooling");
    hint.textContent = "Momentum is slowing. A small action helps.";
  } else {
    setActiveStep("step-ended");
    hint.textContent = "No recent activity detected.";
  }
}

/* ================= STREAM ================= */

function renderStream() {
  const box = document.getElementById("stream");
  box.innerHTML = "";

  if (!state.raw.length) {
    box.innerHTML = `
      <div class="text-gray-400">
        No activity yet — your first submission will start the shift.
      </div>
    `;
    return;
  }

  state.raw.slice(0, 5).forEach(e => {
    box.innerHTML += `
      <div>
        <div class="flex justify-between">
          <span>${e.type}</span>
          <span class="text-gray-400">${e.ago} min ago</span>
        </div>
        <div class="text-xs text-gray-400">
          ${e.note}
        </div>
      </div>
    `;
  });
}

/* ================= CONTEXT ================= */

function renderContext() {
  const me = state.agent[CURRENT_AGENT] || {};
  document.getElementById("subsCount").textContent = me.submissions || 0;
  document.getElementById("qualCount").textContent = me.qualified || 0;
}

/* ================= RENDER ================= */

function renderAll() {
  renderShift();
  renderStream();
  renderContext();
}

/* ================= FIREBASE ================= */

firebase.database()
  .ref(`${FIREBASE_NODE}/live`)
  .on("value", snap => {
    if (!snap.val()) return;

    const d = snap.val();
    state.agent = d.agent || {};
    state.lastSubmission = d.lastSubmission || null;

    if (d.lastSubmission) {
      state.raw = [
        {
          type: "Submission submitted",
          ago: minsAgo(new Date(d.lastSubmission)),
          note: "This restarted your momentum"
        }
      ];
    }

    renderAll();
  });

renderAll();
</script>

</body>
</html>
