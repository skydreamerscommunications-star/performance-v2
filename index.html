<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • My Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white px-6 py-4">
  <h1 class="text-lg font-bold">Sky Dreamers</h1>
  <p class="text-sm text-blue-100">My Performance</p>
</header>

<!-- MAIN -->
<main class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- LAST ACTIVITY -->
  <div class="text-sm text-gray-500">
    Last activity:
    <span id="lastSubmission" class="font-medium text-gray-700">—</span>
  </div>

  <!-- METRICS -->
  <div id="metrics" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>

</main>

<script>
/* =====================================================
   CONFIG
===================================================== */

const CURRENT_AGENT = "ME";                // hardcoded for now
const FIREBASE_NODE = "dashboard_v2";       // existing backend path

/* =====================================================
   FIREBASE INIT
===================================================== */

firebase.initializeApp({
  databaseURL: "https://performance-dashboard-c7017-default-rtdb.firebaseio.com"
});

/* =====================================================
   STATE (SAFE DEFAULTS)
===================================================== */

let state = {
  agent: {},
  lastSubmission: null
};

/* =====================================================
   HELPERS
===================================================== */

function card(label, value, hint = "") {
  return `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-gray-500">${label}</div>
      <div class="text-2xl font-bold">${value}</div>
      ${hint ? `<div class="text-xs text-gray-400 mt-1">${hint}</div>` : ""}
    </div>
  `;
}

function timeAgo(ts) {
  if (!ts) return "—";
  const diff = Date.now() - ts.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return "Just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m ago`;
}

function durationSince(ts) {
  if (!ts) return "—";
  const diff = Date.now() - ts.getTime();
  const m = Math.floor(diff / 60000);
  const h = Math.floor(m / 60);
  return h > 0 ? `${h}h ${m % 60}m` : `${m}m`;
}

function momentum(lastTs) {
  if (!lastTs) return { label: "Cold", color: "text-red-600" };

  const mins = (Date.now() - lastTs.getTime()) / 60000;

  if (mins <= 15) return { label: "Active", color: "text-green-600" };
  if (mins <= 45) return { label: "Warming", color: "text-yellow-600" };
  return { label: "Cold", color: "text-red-600" };
}

/* =====================================================
   RENDER
===================================================== */

function renderMyPerformance() {
  const container = document.getElementById("metrics");
  container.innerHTML = "";

  const me = state.agent[CURRENT_AGENT] || {
    submissions: 0,
    qualified: 0
  };

  const lastTs = state.lastSubmission
    ? new Date(state.lastSubmission)
    : null;

  const m = momentum(lastTs);

  // Momentum (state-based)
  container.innerHTML += `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-gray-500">Momentum</div>
      <div class="text-2xl font-bold ${m.color}">${m.label}</div>
      <div class="text-xs text-gray-400 mt-1">
        Based on recent activity
      </div>
    </div>
  `;

  // Last action
  container.innerHTML += card(
    "Last Action",
    timeAgo(lastTs),
    "Most recent submission"
  );

  // Submissions
  container.innerHTML += card(
    "Submissions",
    me.submissions,
    "Today"
  );

  // Qualified
  container.innerHTML += card(
    "Qualified",
    me.qualified,
    "Today"
  );

  // Flow time
  container.innerHTML += card(
    "Flow Time",
    durationSince(lastTs),
    lastTs ? "Since last action" : "No activity yet"
  );
}

function render() {
  document.getElementById("lastSubmission").textContent =
    state.lastSubmission
      ? new Date(state.lastSubmission).toLocaleString()
      : "—";

  renderMyPerformance();
}

/* =====================================================
   INITIAL RENDER (IMPORTANT)
===================================================== */

render();

/* =====================================================
   FIREBASE LISTENER
===================================================== */

firebase.database()
  .ref(`${FIREBASE_NODE}/live`)
  .on("value", snap => {
    if (snap.val()) {
      state = snap.val();
    }
    render();
  });
</script>

</body>
</html>
