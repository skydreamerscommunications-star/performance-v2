<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • My Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white px-6 py-4">
  <h1 class="text-lg font-bold">Sky Dreamers</h1>
  <p class="text-sm text-blue-100">My Performance</p>
</header>

<!-- MAIN -->
<main class="max-w-3xl mx-auto px-6 py-8 space-y-12">

  <!-- ===================== -->
  <!-- ZONE 1: SHIFT STATE -->
  <!-- ===================== -->
  <section class="bg-white rounded-2xl shadow p-6 space-y-4">
    <div class="text-xs uppercase tracking-wide text-gray-400">
      Shift State
    </div>

    <div class="flex justify-between items-center text-sm">
      <div class="flex flex-col items-center gap-1">
        <div class="w-3 h-3 rounded-full bg-blue-600"></div>
        <span class="text-blue-600 font-medium">In Progress</span>
      </div>

      <div class="flex flex-col items-center gap-1 opacity-40">
        <div class="w-3 h-3 rounded-full bg-gray-400"></div>
        <span>Cooling</span>
      </div>

      <div class="flex flex-col items-center gap-1 opacity-40">
        <div class="w-3 h-3 rounded-full bg-gray-400"></div>
        <span>Ended</span>
      </div>
    </div>

    <div class="text-sm text-gray-500">
      You’re inside an active working window.
    </div>
  </section>

  <!-- ========================= -->
  <!-- ZONE 2: MOMENTUM STREAM -->
  <!-- ========================= -->
  <section class="space-y-4">
    <div class="text-xs uppercase tracking-wide text-gray-400">
      Momentum
    </div>

    <div class="bg-white rounded-2xl shadow p-6 space-y-5">

      <!-- Timeline item -->
      <div class="flex gap-4">
        <div class="flex flex-col items-center">
          <div class="w-2 h-2 rounded-full bg-blue-600"></div>
          <div class="flex-1 w-px bg-gray-200 mt-2"></div>
        </div>

        <div class="flex-1">
          <div class="flex justify-between text-sm">
            <span class="font-medium">Submission submitted</span>
            <span class="text-gray-400">12 min ago</span>
          </div>
          <div class="text-xs text-gray-400 mt-1">
            This restarted your momentum
          </div>
        </div>
      </div>

      <!-- Timeline item -->
      <div class="flex gap-4">
        <div class="flex flex-col items-center">
          <div class="w-2 h-2 rounded-full bg-gray-300"></div>
        </div>

        <div class="flex-1">
          <div class="flex justify-between text-sm">
            <span class="font-medium">Submission submitted</span>
            <span class="text-gray-400">38 min ago</span>
          </div>
          <div class="text-xs text-gray-400 mt-1">
            Maintained continuity
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ===================== -->
  <!-- ZONE 3: TODAY SO FAR -->
  <!-- ===================== -->
  <section class="bg-white rounded-2xl shadow p-6">
    <div class="text-xs uppercase tracking-wide text-gray-400 mb-4">
      Today, so far
    </div>

    <div class="flex justify-around text-center">
      <div>
        <div class="text-2xl font-bold">4</div>
        <div class="text-xs text-gray-500">Submissions</div>
      </div>

      <div>
        <div class="text-2xl font-bold">1</div>
        <div class="text-xs text-gray-500">Qualified</div>
      </div>
    </div>
  </section>

</main>

</body>
</html>
