<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sky Dreamers • Agent Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-white border-b px-8 py-6">
  <div class="max-w-6xl mx-auto space-y-1">
    <h1 class="text-xl font-semibold text-gray-900">
      Sky Dreamers — Agent Performance
    </h1>
    <p class="text-gray-600">
      Welcome Agent.  
      <span class="text-gray-400">Your last submission:</span>
      <span class="font-medium">—</span>
    </p>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-6xl mx-auto px-8 py-8">

  <!-- KPI CARDS -->
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-5">

    <!-- Submissions -->
    <div class="bg-white rounded-xl shadow p-5">
      <div class="text-sm text-gray-500">Submissions</div>
      <div class="text-3xl font-bold text-gray-900 mt-1">0</div>
      <div class="text-xs text-gray-400 mt-2">Effort</div>
    </div>

    <!-- Qualified -->
    <div class="bg-white rounded-xl shadow p-5">
      <div class="text-sm text-gray-500">Qualified</div>
      <div class="text-3xl font-bold text-green-600 mt-1">0</div>
      <div class="text-xs text-gray-400 mt-2">Output</div>
    </div>

    <!-- Not Qualified -->
    <div class="bg-white rounded-xl shadow p-5">
      <div class="text-sm text-gray-500">Not Qualified</div>
      <div class="text-3xl font-bold text-red-500 mt-1">0</div>
      <div class="text-xs text-gray-400 mt-2">Bad output</div>
    </div>

    <!-- Momentum -->
    <div class="bg-white rounded-xl shadow p-5">
      <div class="text-sm text-gray-500">Momentum</div>
      <div class="text-xl font-semibold text-yellow-600 mt-2">
        Cold
      </div>
      <div class="text-xs text-gray-400 mt-2">Consistency</div>
    </div>

    <!-- Remaining Target -->
    <div class="bg-white rounded-xl shadow p-5">
      <div class="text-sm text-gray-500">Remaining Target</div>
      <div class="text-3xl font-bold text-gray-900 mt-1">—</div>
      <div class="text-xs text-gray-400 mt-2">Goal</div>
    </div>

  </section>

</main>

</body>
</html>
